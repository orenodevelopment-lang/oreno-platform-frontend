name: Live staging browser tests

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1-5"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    environment: staging
    env:
      E2E_LIVE: "true"
      E2E_WEB_URL: ${{ secrets.E2E_WEB_URL }}
      E2E_API_URL: ${{ secrets.E2E_API_URL }}
      NEXT_PUBLIC_ORENO_API_URL: ${{ secrets.E2E_API_URL }}
      NEXT_PUBLIC_ORENO_SOCKET_URL: ${{ secrets.E2E_API_URL }}
      E2E_VERIFICATION_TOKEN: ${{ secrets.E2E_VERIFICATION_TOKEN }}
      E2E_TALENT_EMAIL: ${{ secrets.E2E_TALENT_EMAIL }}
      E2E_TALENT_PASSWORD: ${{ secrets.E2E_TALENT_PASSWORD }}
      E2E_TALENT_TWO_FACTOR_CODE: ${{ secrets.E2E_TALENT_TWO_FACTOR_CODE }}
      E2E_COMPANY_EMAIL: ${{ secrets.E2E_COMPANY_EMAIL }}
      E2E_COMPANY_PASSWORD: ${{ secrets.E2E_COMPANY_PASSWORD }}
      E2E_COMPANY_TWO_FACTOR_CODE: ${{ secrets.E2E_COMPANY_TWO_FACTOR_CODE }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_ADMIN_TWO_FACTOR_CODE: ${{ secrets.E2E_ADMIN_TWO_FACTOR_CODE }}
      E2E_CANDIDATE_A_EMAIL: ${{ secrets.E2E_CANDIDATE_A_EMAIL }}
      E2E_CANDIDATE_A_PASSWORD: ${{ secrets.E2E_CANDIDATE_A_PASSWORD }}
      E2E_CANDIDATE_A_TWO_FACTOR_CODE: ${{ secrets.E2E_CANDIDATE_A_TWO_FACTOR_CODE }}
      E2E_CANDIDATE_B_EMAIL: ${{ secrets.E2E_CANDIDATE_B_EMAIL }}
      E2E_CANDIDATE_B_PASSWORD: ${{ secrets.E2E_CANDIDATE_B_PASSWORD }}
      E2E_CANDIDATE_B_TWO_FACTOR_CODE: ${{ secrets.E2E_CANDIDATE_B_TWO_FACTOR_CODE }}
      E2E_CANDIDATE_C_EMAIL: ${{ secrets.E2E_CANDIDATE_C_EMAIL }}
      E2E_CANDIDATE_C_PASSWORD: ${{ secrets.E2E_CANDIDATE_C_PASSWORD }}
      E2E_CANDIDATE_C_TWO_FACTOR_CODE: ${{ secrets.E2E_CANDIDATE_C_TWO_FACTOR_CODE }}
      E2E_REVIEWER_EMAIL: ${{ secrets.E2E_REVIEWER_EMAIL }}
      E2E_REVIEWER_PASSWORD: ${{ secrets.E2E_REVIEWER_PASSWORD }}
      E2E_REVIEWER_TWO_FACTOR_CODE: ${{ secrets.E2E_REVIEWER_TWO_FACTOR_CODE }}
      E2E_RELEASE_APPROVER_EMAIL: ${{ secrets.E2E_RELEASE_APPROVER_EMAIL }}
      E2E_RELEASE_APPROVER_PASSWORD: ${{ secrets.E2E_RELEASE_APPROVER_PASSWORD }}
      E2E_RELEASE_APPROVER_TWO_FACTOR_CODE: ${{ secrets.E2E_RELEASE_APPROVER_TWO_FACTOR_CODE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
